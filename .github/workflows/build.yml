name: Compilar APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceptar licencias del SDK
        run: yes | sdkmanager --licenses || true

      - name: Compilar APK debug
        shell: bash
        run: |
          gradle assembleDebug --no-daemon 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Subir log si falla
        if: failure()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.email "ci@local"
          git config user.name "CI Bot"
          git checkout --orphan build-logs-tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/build.log ./build.log
          git add build.log
          git commit -m "log de build fallido"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:build-logs

      - name: Subir APK como artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rutina-fredy-apk
          path: app/build/outputs/apk/debug/app-debug.apk
